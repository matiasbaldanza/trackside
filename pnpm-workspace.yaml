## Build scripts must be approved explicitly under pnpm 10+.
## Each entry is a transitive dependency that compiles or downloads a
## platform-specific binary during install:
##   esbuild       - bundler used by the Sanity toolchain
##   sharp         - image processing used by Next's image optimizer
##   unrs-resolver - module resolution used by eslint-config-next
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
